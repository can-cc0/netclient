name: APK Derle

# Depoya dosya yuklenince VE elle "Run workflow" ile calisir
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest   # x86_64 bulut sunucu — Android araclari burada calisir
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sistem bagimliliklari
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: APK derle
        run: buildozer android debug

      - name: APK'yi yukle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: netclient-apk
          path: bin/*.apk
